name: pepicloud

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_REPL_USER: ${PG_REPL_USER}
      PG_REPL_PASSWORD: ${PG_REPL_PASSWORD}
    # wal_level=replica + summarize_wal=on => habilita backups incrementales nativos (PG17)
    command: ["postgres", "-c", "wal_level=replica", "-c", "summarize_wal=on", "-c", "max_wal_senders=5"]
    volumes:
      - pg_data:/var/lib/postgresql/data          # datos en operación
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest     # MinIO RELEASE.2026-09-22 (compilado por Chainguard)
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data       # persistencia en disco: los objetos sobreviven a reinicios
    ports:
      - "${MINIO_CONSOLE_PORT:-9011}:9001"   # consola web de MinIO (opcional): http://localhost:9011

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    entrypoint: ["bash", "/init/init-buckets.sh"]
    environment:
      MC_HOST_pepi: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      BUCKET_PRIMARY: ${BUCKET_PRIMARY}
      BUCKET_SECONDARY: ${BUCKET_SECONDARY}
      BUCKET_BACKUP: ${BUCKET_BACKUP}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./minio/init-buckets.sh:/init/init-buckets.sh:ro
    depends_on: [minio]

  app:
    build: ./app
    env_file: .env            # credenciales y claves solo en tiempo de ejecución
    environment:
      PGHOST: postgres
      BACKUP_DIR: /backups
      S3_ENDPOINT: http://minio:9000   # tiene prioridad sobre .env
    volumes:
      - pg_backups:/backups   # respaldos fuera del volumen de datos de PostgreSQL
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pg_data:
  pg_backups:
  minio_data:
